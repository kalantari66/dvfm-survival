mode: real
seed: 42
repeats: 1
output_dir: outputs/paper_real
device: auto

split:
  strategy: kfold
  folds: 5

preprocessing:
  standardize: true
  time_normalize: train_max

datasets:
  - name: ALS_PROACT
    path: data/raw/proact_processed_mod.xlsx
    time_col: merged_time
    event_col: Status
  - name: Cancer_METABRIC
    path: data/raw/Metabric.csv
    time_col: time
    event_col: delta
  - name: ALS_CALSNIC
    path: data/raw/calsnic_survival.xlsx
    time_col: merged_time
    event_col: Status

models:
  enabled: [coxph, deepsurv, mtlr, clayton_aft, dvfm]
  dvfm: {latent_dim: 20, epochs: 200, lr: 0.001, batch_size: 64, beta_max: 1.0, warmup_epochs: 50, free_bits: 0.0, mc_samples: 100}
  deepsurv: {epochs: 200, lr: 0.001, batch_size: 64}
  mtlr: {epochs: 200, lr: 0.005, bins: 200}
  clayton_aft: {epochs: 100, lr: 0.005}

evaluation:
  n_time_points: 1000
  max_time_factor: 1.5
  save_predictions: false
