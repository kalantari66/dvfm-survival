schema_version: 1

workflow:
  target_name: synthetic_copula_pilot

resources:
  cores: 4
  memory: 25g
  walltime: "02:00:00"
  partition: gpu-l40s
  account: c2i-colon

study:
  name: synthetic-copula-pilot
  stage: pilot
  output_dir: outputs/synthetic-copula-pilot
  seeds: [0, 1, 2]
compute:
  # Fail loudly if SLURM assigns no usable GPU or PyTorch lacks CUDA support.
  device: cuda
  torch_num_threads: 4
data:
  source: synthetic_copula
  n_samples: 2000
  n_features: 10
  scenarios:
    - {id: independent, copula: frank, theta: 0.0, dependence: independent}
    - {id: clayton-moderate, copula: clayton, theta: 2.0, dependence: moderate}
    - {id: frank-strong, copula: frank, theta: 10.0, dependence: strong}
    - {id: gumbel-strong, copula: gumbel, theta: 4.0, dependence: strong}
split:
  strategy: holdout
  test_fraction: 0.20
preprocessing:
  standardize_x: true
  time_normalization: train_max
models:
  enabled: [coxph, deepsurv, mtlr, clayton_aft, dvfm]
  dvfm: {latent_dim: 1, epochs: 200, learning_rate: 0.001, batch_size: 64, beta_max: 1.0, warmup_epochs: 50, free_bits: 0.0, mc_samples: 100}
evaluation:
  n_time_points: 200
  max_time_factor: 1.2
  save_predictions: false
  primary_metrics: [ibs_oracle, mae_oracle]
