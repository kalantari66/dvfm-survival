schema_version: 1
workflow: {target_name: semi_synthetic_tuning_deepsurv}
# DeepSurv is a small MLP trained full-batch on CPU, so this study needs no GPU.
resources: {cores: 4, memory: 25g, walltime: "02:00:00", account: c2i-colon}
experiment_config: configs/semi_synthetic.yaml
study:
  name: semi-synthetic-tuning-deepsurv
  output_dir: results/semi-synthetic-tuning-deepsurv
development:
  # Identical to semi_synthetic_tuning.yaml so the selections stay comparable
  # with the other models' tuned_by_dataset entries. Its validation partition
  # is never used by the final ten-seed reporting suite.
  seed: 99
  copula: gaussian
  kendall_tau: 0.50
  validation_fraction: 0.30
  time_bins: 20
tuning:
  # Ten random draws, matching every other model's budget in
  # semi_synthetic_tuning.yaml. Raising it would tune DeepSurv harder than the
  # baselines it is compared against.
  trials: 10
  # The generated DGP provides true event times, so select directly against
  # ground-truth event survival rather than an observed-data censoring proxy.
  selection_metric: IBS Oracle
  search_spaces:
    deepsurv:
      # Katzman et al. (2017) Table 3 tune Adam to 0.010-0.154 on the real
      # datasets (WHAS 0.067, SUPPORT 0.047, METABRIC 0.010, GBSG 0.154), so
      # the grid has to reach that range; full-batch training makes one epoch
      # one gradient step, which a sub-0.001 rate cannot exploit.
      learning_rate: [0.001, 0.003, 0.01, 0.03, 0.1]
      weight_decay: [0.0, 0.00001, 0.0001, 0.001]
      hidden_dims: [[16], [32, 16], [64], [64, 32], [64, 64, 16]]
      dropout: [0.0, 0.1, 0.25]
