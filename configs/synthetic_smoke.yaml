schema_version: 1

study:
  name: synthetic-smoke
  stage: smoke
  output_dir: results/synthetic-smoke
  seeds: [0]

compute:
  device: cuda
  torch_num_threads: 4

data:
  source: synthetic_copula
  n_samples: 256
  n_features: 5
  scenarios:
    - id: independent
      copula: frank
      theta: 0.0
      dependence: independent

split:
  strategy: holdout
  test_fraction: 0.20

preprocessing:
  standardize_x: true
  time_normalization: train_max

models:
  enabled: [dvfm]
  dvfm:
    latent_dim: 1
    epochs: 2
    learning_rate: 0.001
    batch_size: 64
    beta_max: 1.0
    warmup_epochs: 1
    free_bits: 0.0
    mc_samples: 2

evaluation:
  n_time_points: 20
  max_time_factor: 1.2
  save_predictions: false
  primary_metrics: [ibs_oracle, mae_oracle]
