# Simplified mechanistic benchmark incorporating colleague's prediction settings.
# Main scientific settings:
# - beta_max = 1.0
# - KL warmup reaches beta_max by epoch 50
# - learning_rate = 0.001
#
# Run:
#   python -m experiments.synthetic_gaussian_latent \
#       --config configs/experiments/gaussian_latent_mechanistic_simplified.yaml
#
# Fits:
#   3 tau x 2 censoring x 5 seeds x
#   [1 no-latent + 2 shared dz + 2 separate dz] = 150 fits

output_dir: results/dvfm_gaussian_latent_mechanistic_simplified
resume: true
device: auto
torch_num_threads: 4

grid:
  seeds: [0, 1, 2, 3, 4]
  kendall_tau: [0.00, 0.50, 0.75]
  censoring_rates: [0.30, 0.70]
  latent_dims: [1, 20]
  include_separate_latent: true

synthetic:
  n_samples: 5000
  n_features: 10

  # True hidden mechanism: scalar Z~N(0,1), independent of X.
  # T|X,Z and C|X,Z are exactly Weibull.
  latent_effect: tanh
  event_shape: 1.5
  censor_shape: 1.3
  event_base_scale: 1.0
  censor_base_scale: 1.0
  covariate_effect_scale: 0.60
  dgp_parameter_seed: 2026

  tau_calibration_samples: 100000
  tau_calibration_seed: 12345
  tau_calibration_steps: 24
  tau_loading_upper: 16.0

split:
  validation_fraction: 0.15
  test_fraction: 0.15

preprocessing:
  standardize_x: true
  time_normalization: train_max

model:
  encoder_hidden: [64, 32]
  decoder_hidden: [32, 64]

training:
  epochs: 150
  minimum_epochs: 50
  early_stopping_patience: 20

  # Colleague-recommended prediction settings.
  learning_rate: 0.001
  beta_max: 1.0
  warmup_epochs: 50

  batch_size: 64
  free_bits: 0.0
  lr_patience: 10
  lr_factor: 0.5
  grad_clip: 1.0
  minimum_improvement: 0.00001
  log_every: 25

evaluation:
  # Easy-mode test: prior exactly matches true latent-generating distribution.
  latent_distribution: prior
  mc_samples: 100
  n_time_points: 150
  grid_max_quantile: 0.95
  dependence_mc_samples: 1500
  active_dim_kl_threshold: 0.01
