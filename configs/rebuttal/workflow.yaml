# SLURM resources and job lists for workflows/rebuttal/workflow.py.
# Scientific settings are not here: every job reads the paper configs
# (synthetic.yaml, semi_synthetic.yaml, proact_latent_ablation.yaml) or
# configs/rebuttal/{stratified,smooth}_dependence.yaml.
account: c2i-colon
resources:
  # Every GPU job fits in gpu-short's 2 h cap at the measured ~75 s per DVFM
  # fit and ~135 s per HACSurv fit (N = 10,000): a dataset x seed (5 fits), a
  # synthetic cell (10 fits), PRO-ACT (20 fits), a Task 6 variant (10 + 10
  # fits) and the Task 2 GPU timings (9 cells x 3 models) are all < 1 h.
  gpu: {partition: gpu-short, cores: 4, memory: 25g, walltime: "02:00:00"}
  # CoxPH and Cox--Gamma refits (Task 3) and the like-for-like CPU timings
  # (Task 2), as in the benchmark's CPU jobs.
  cpu: {cores: 4, memory: 25g, walltime: "06:00:00"}
# gpu-short has 8 GPUs. Target groups listed here run their GPU-capable script
# on CPU instead (cpu resources, --device cpu). Results are unchanged in
# meaning, but a CPU fit draws DVFM's training noise from the CPU RNG, not the
# CUDA stream the paper's fits used, so it reproduces a paper fit only up to
# seed-to-seed noise. Kept on GPU: task1_semi (reproduction check, reference
# for Tasks 3 and 5), task2 GPU timings and task4 (reproduction check).
run_on_cpu: [task1_synthetic, task5, task6diag, task7]
seed_count: 10
synthetic_scenarios: 12
task2_datasets: [gbsg, support, seer_liver]
task5_datasets: [gbsg, seer_liver, support, metabric]
task5_variants: [two_trunk_independent, two_trunk_shared]
# Task 7 decoders, on the synthetic grid and on the task5_datasets.
task7_variants: [theorem_class, theorem_class_alpha0]
