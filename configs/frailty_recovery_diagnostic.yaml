schema_version: 1
workflow: {target_name: frailty_recovery_diagnostic}
resources: {cores: 4, memory: 25g, walltime: "02:00:00", partition: gpu-l40s, account: c2i-colon}
study:
  name: frailty-recovery-diagnostic
  stage: diagnostic
  output_dir: results/frailty-recovery-diagnostic
seeds:
  dgp: 2026
  sampling: [0, 1, 2, 3, 4]
  split: [100, 101, 102, 103, 104]
  model: [200, 201, 202, 203, 204]
compute: {device: cuda, torch_num_threads: 4}
data:
  source: frailty_recovery_diagnostic
  mechanisms: [gaussian_shared_frailty, clayton_gamma_frailty]
  n_samples: 8873
  n_features: 10
  kendall_tau: 0.50
  censoring_rate: 0.50
  calibration_samples: 50000
split: {strategy: holdout, validation_fraction: 0.15, test_fraction: 0.15}
preprocessing: {zscore_x: false}
models:
  enabled: [dvfm]
  dvfm:
    latent_dim: 1
    encoder_hidden: [64, 32]
    decoder_hidden: [32, 64]
    batch_size: 64
    free_bits: 0.0
  oracle_z_decoder:
    decoder_hidden: [32, 64]
    maximum_epochs: 300
    minimum_epochs: 150
    learning_rate: 0.0005
    batch_size: 128
    lr_patience: 12
    early_stopping_patience: 35
    minimum_learning_rate: 0.000001
training_variants:
  - name: current
    maximum_epochs: 200
    minimum_epochs: 0
    learning_rate: 0.001
    batch_size: 64
    beta_max: 1.0
    warmup_epochs: 50
    lr_patience: 10
    early_stopping_patience: null
    minimum_learning_rate: 0.000001
    scheduler_metric: validation_elbo
    checkpoint_selection: final
  - name: checkpoint_fix
    maximum_epochs: 200
    minimum_epochs: 0
    learning_rate: 0.001
    batch_size: 64
    beta_max: 1.0
    warmup_epochs: 50
    lr_patience: 10
    early_stopping_patience: null
    minimum_learning_rate: 0.000001
    scheduler_metric: validation_elbo
    checkpoint_selection: best_validation_reconstruction_nll
  - name: old_training
    maximum_epochs: 300
    minimum_epochs: 150
    learning_rate: 0.0005
    batch_size: 128
    beta_max: 0.2
    warmup_epochs: 150
    lr_patience: 12
    early_stopping_patience: 35
    minimum_learning_rate: 0.000001
    scheduler_metric: validation_reconstruction_nll
    checkpoint_selection: best_validation_reconstruction_nll
  - name: schedule_isolation
    maximum_epochs: 300
    minimum_epochs: 150
    learning_rate: 0.0005
    batch_size: 128
    beta_max: 1.0
    warmup_epochs: 150
    lr_patience: 12
    early_stopping_patience: 35
    minimum_learning_rate: 0.000001
    scheduler_metric: validation_reconstruction_nll
    checkpoint_selection: best_validation_reconstruction_nll
evaluation:
  n_time_points: 200
  grid_max_quantile: 0.95
  mc_samples: 100
  dependence_samples_per_epoch: 1000
  dependence_samples_checkpoint: 5000
  save_prediction_curves: false
  save_subject_latents: true
  primary_metrics: [frailty_spearman, frailty_r2_calibrated, absolute_conditional_kendall_tau_error, oracle_ibs]
