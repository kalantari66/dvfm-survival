mode: real
seed: 42
repeats: 1
output_dir: outputs/real_example

split: {strategy: holdout, test_size: 0.30}
preprocessing: {standardize: true, time_normalize: train_max}

data:
  name: toy_real
  path: data/examples/toy_real.csv
  time_col: time
  event_col: event

models:
  enabled: [coxph, deepsurv, mtlr, clayton_aft, dvfm]
  dvfm: {latent_dim: 20, epochs: 200, lr: 0.001, batch_size: 64, beta_max: 1.0, warmup_epochs: 50, free_bits: 0.0, mc_samples: 100}
  deepsurv: {epochs: 200, lr: 0.001, batch_size: 64}
  mtlr: {epochs: 200, lr: 0.005, bins: 200}
  clayton_aft: {epochs: 100, lr: 0.005}

evaluation: {n_time_points: 1000, max_time_factor: 1.5, save_predictions: false}
