schema_version: 1
study:
  name: semi-synthetic-smoke
  stage: smoke
  output_dir: results/semi-synthetic-smoke
  seeds: [7]
compute:
  device: auto
data:
  source: semi_synthetic_file
  name: toy
  path: data/examples/toy_semi_synthetic.csv
  true_event_time_column: event_time
  true_censor_time_column: censor_time
split:
  strategy: holdout
  test_fraction: 0.30
preprocessing:
  standardize_x: true
  time_normalization: train_max
models:
  enabled: [dvfm]
  dvfm: {latent_dim: 1, epochs: 200, learning_rate: 0.001, batch_size: 32, beta_max: 1.0, warmup_epochs: 50, free_bits: 0.0, mc_samples: 20}
evaluation:
  n_time_points: 50
  max_time_factor: 1.2
  save_predictions: false
  primary_metrics: [ibs_oracle, mae_oracle]
