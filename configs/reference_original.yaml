schema_version: 1
study:
  name: reference-original
  stage: reference
  output_dir: results/reference-original
  seeds: [42]
compute:
  device: cuda
  torch_num_threads: 1
data:
  source: synthetic_copula
  n_samples: 10000
  n_features: 10
  scenarios:
    - {id: gaussian-theta-1, name: gaussian-theta-1, copula: gaussian, theta: 1.0, dependence: reference}
split:
  strategy: holdout
  test_fraction: 0.30
preprocessing:
  standardize_x: false
  time_normalization: none
models:
  enabled: [dvfm]
  dvfm: {latent_dim: 20, epochs: 200, learning_rate: 0.001, batch_size: 64, beta_max: 1.0, warmup_epochs: 50, free_bits: 0.0, mc_samples: 100}
evaluation:
  n_time_points: 1000
  max_time_factor: 1.5
  save_predictions: false
  primary_metrics: [ibs_oracle, mae_oracle]
