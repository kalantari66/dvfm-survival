evaluation:
  # One training-only grid is used to query every model. The upper bound is
  # robust to isolated long censored observations; MTLR keeps its own bins.
  n_time_points: 100
  time_grid: uniform_train_event_quantile
  grid_max_quantile: 0.95
  # Primary semi-synthetic accuracy: evaluated against DGP event-time truth.
  primary_metrics: [oracle_ibs]
  # Observed-data-style sensitivity only; it assumes conditionally independent
  # censoring and is not used for selection or primary conclusions.
  secondary_sensitivity_metrics: [ibs_ipcw]
  save_predictions: false
  # Distribution plots are generated directly by the results notebook.
  save_event_distribution_plots: false
  # Export while DVFM is fitted: the notebook cannot reconstruct posterior
  # subject latents from aggregate result tables alone.
  save_latent_recovery: true
  dependence_samples: 10000
  # Evaluated only for models exposing a joint event/censor survival surface
  # (DVFM and HACSurv), not for marginal-survival comparators.
  compute_oracle_joint_survival_ise: true
  joint_n_time_points: 15
  joint_grid_max_quantile: 0.95
  joint_n_subjects: 128
  joint_dgp_samples: 2000
  joint_model_samples: 500
  joint_model_batch_size: 32
