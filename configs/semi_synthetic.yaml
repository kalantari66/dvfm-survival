# SUPPORT semi-synthetic experiment with YAML-selectable copula.
#
# Run:
#   python -m dvfm.semi_synthetic --config configs/semi_synthetic.yaml
#
# generation.copula may be:
#   gaussian
#   clayton
#
# For Clayton tau=0.5, theta=2.

experiment:
  name: support_clayton_tau05
  seed: 0
  output_dir: outputs/semi_synthetic_support_clayton_tau05

data:
  source_path: data/support.feather
  generated_csv: data/semi_synthetic_support_clayton_tau05.csv
  source_time_col: duration
  source_event_col: event

  numerical_features:
    - x0
    - x7
    - x8
    - x9
    - x10
    - x11
    - x12
    - x13

  categorical_features:
    - x1
    - x2
    - x3
    - x4
    - x5
    - x6

generation:
  copula: clayton
  kendall_tau: 0.50
  target_censoring_rate: 0.30

  coxph_penalizer: 0.001
  coxph_l1_ratio: 0.0
  coxph_tail_points: 10
  censoring_rate_tolerance: 0.001

split:
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15
  stratify_by_event: true

preprocessing:
  standardize_numerical: true
  one_hot_categorical: true
  time_normalization: train_max

dvfm:
  latent_dim: 1
  encoder_hidden: [64, 32]
  decoder_hidden: [32, 64]

  epochs: 300
  learning_rate: 0.0005
  batch_size: 128

  beta_max: 0.20
  warmup_epochs: 150
  free_bits: 0.0
  device: cpu

training:
  minimum_epochs: 150
  early_stopping_patience: 35
  lr_patience: 12

latent_recovery:
  # For Clayton this is a normal-score shared dependence proxy, not a true
  # latent frailty. Interpret recovery accordingly.
  target_column: z_shared_direction
  selection_metric: validation_abs_pearson
  report_subgroups: true
  save_latent_predictions: true
