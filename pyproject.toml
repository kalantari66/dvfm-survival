[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dvfm-survival"
version = "0.2.0"
description = "Deep Variational Frailty Models for survival prediction under dependent censoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "lifelines>=0.28",
  "matplotlib>=3.7",
  "openpyxl>=3.1",
  "PyYAML>=6.0",
  "SurvivalEVAL>=0.8.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
dvfm-run = "dvfm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
