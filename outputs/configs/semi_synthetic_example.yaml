mode: semi_synthetic
seed: 42
repeats: 1
output_dir: outputs/semi_synthetic_example
device: auto

split: {strategy: holdout, test_size: 0.20}
preprocessing: {standardize: true, time_normalize: train_max}

data:
  name: toy_semi_synthetic
  path: data/examples/toy_semi_synthetic.csv
  true_event_time_col: event_time
  true_censor_time_col: censor_time

models:
  enabled: [coxph, deepsurv, mtlr, clayton_aft, dvfm]

evaluation: {n_time_points: 200, max_time_factor: 1.5, save_predictions: false}
